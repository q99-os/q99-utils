[project]
name = "q99-utils"
version = "0.2.0"
description = "Library of common q99 services"
readme = "README.md"
authors = [{ name = "Q99" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.137.2",
    "httpx==0.28.1",
    "pydantic==2.12.5",
]

[project.optional-dependencies]
# Google Drive talks to the Drive API through Google's own SDK. Kept optional so
# consumers that don't onboard Drive aren't forced to install it.
google = [
    "google-api-python-client==2.154.0",
    "google-auth==2.43.0",
]
# OpenWells' canonical SQL is T-SQL; anything else is transpiled at query time.
openwells = [
    "sqlglot==30.0.1",
]

[dependency-groups]
dev = [
    "pip-audit==2.10.0",
    "bandit==1.9.4",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# Supply-chain quarantine: reject packages published less than 7 days ago
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["q99_utils"]
